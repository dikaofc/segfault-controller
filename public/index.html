<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>lsd.segfault.net — console</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
:root{--bg:#0a0a0a;--bar:#101010;--line:#262626;--txt:#d7d7d7;--dim:#7a7a7a;--acc:#4cc38a;--warn:#e5c07b;--err:#e06c75}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:10px;background:var(--bar);border-bottom:1px solid var(--line);padding:8px 12px;flex-wrap:wrap}
.led{width:9px;height:9px;border-radius:50%;background:var(--err);flex:none}
.led.on{background:var(--acc)}
.node{white-space:nowrap}
.node b{font-weight:700}
.node span{color:var(--dim);font-size:12px;margin-left:8px}
.top .sp{flex:1}
.top input{background:#000;color:var(--txt);border:1px solid var(--line);padding:7px 10px;font:inherit;min-width:0;width:220px}
.top input:focus{outline:none;border-color:var(--acc)}
.btn{background:#000;color:var(--txt);border:1px solid var(--line);padding:7px 14px;font:inherit;cursor:pointer;letter-spacing:.08em}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.menu{display:flex;gap:0;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{background:transparent;border:0;border-right:1px solid var(--line);color:var(--dim);font:inherit;font-size:12px;padding:9px 14px;cursor:pointer;white-space:nowrap;letter-spacing:.06em}
.menu button:hover{color:var(--txt);background:#161616}
.menu button b{color:var(--acc);font-weight:400;margin-right:6px}
#wrap{flex:1;min-height:0;position:relative;background:#000}
#term{position:absolute;inset:0;padding:8px}
#simple{display:none;flex-direction:column;position:absolute;inset:0;background:#000;padding:10px;gap:8px}
#simple pre{flex:1;margin:0;overflow:auto;background:var(--bar);border:1px solid var(--line);padding:10px;white-space:pre-wrap;font-size:13px}
#simple .row{display:flex;gap:8px}
#simple input{flex:1;background:var(--bar);color:var(--txt);border:1px solid var(--line);padding:10px;font:inherit;min-width:0}
.status{display:flex;gap:0;background:var(--bar);border-top:1px solid var(--line);font-size:12px;color:var(--dim);flex:none;overflow-x:auto;scrollbar-width:none}
.status::-webkit-scrollbar{display:none}
.status span{padding:6px 12px;border-right:1px solid var(--line);white-space:nowrap}
.status b{color:var(--txt);font-weight:400}
@media (max-width:640px){
  body{font-size:13px}
  .top input{width:100%;flex:1 1 100%;order:5}
  .node span{display:none}
  .menu button{padding:10px 12px}
  #term{padding:4px}
}
</style>
</head>
<body>
<div class="top">
  <span class="led" id="dot"></span>
  <div class="node"><b>lsd</b><span>root@lsd.segfault.net · segfault vm</span></div>
  <div class="sp"></div>
  <input id="token" type="password" placeholder="controller token" autocomplete="off" spellcheck="false">
  <button class="btn primary" id="btnConn" onclick="toggleConn()">CONNECT</button>
  <button class="btn" id="btnMode" onclick="toggleMode()">SIMPLE</button>
</div>
<nav class="menu">
  <button onclick="snip('uptime; echo ---; df -h /sec | tail -1; echo ---; free -m | head -2')"><b>01</b>STATUS</button>
  <button onclick="snip('top -b -n1 | head -18')"><b>02</b>TOP</button>
  <button onclick="snip('tmux ls 2>&1; echo ---; ss -ltnp 2>/dev/null | head -8')"><b>03</b>SESI+PORT</button>
  <button onclick="snip('curl -s -m 3 -o /dev/null http://127.0.0.1:20128/v1/models && echo 9router:HIDUP || echo 9router:MATI; pgrep -f hermes\\ gateway\\ run >/dev/null && echo gateway:HIDUP || echo gateway:MATI')"><b>04</b>SERVICE</button>
  <button onclick="snip('tail -25 /sec/root/.hermes/gateway-logs/up-trigger.log 2>/dev/null || tail -25 /sec/root/.hermes/gateway-logs/up.log 2>/dev/null; echo ---; tail -8 /sec/root/.9router/server.log 2>/dev/null')"><b>05</b>LOG</button>
  <button onclick="snip('/sec/root/segfault/up.sh')"><b>06</b>RESTORE</button>
  <button onclick="ping()"><b>07</b>KEEPALIVE</button>
</nav>
<div id="wrap">
  <div id="term"></div>
  <div id="simple">
    <pre id="sout">simple mode — ketik perintah di bawah, Enter untuk jalan.</pre>
    <div class="row"><input id="sin" placeholder="uptime" autocomplete="off" autocapitalize="off"><button class="btn primary" onclick="sgo()">RUN</button></div>
  </div>
</div>
<div class="status">
  <span>cwd <b id="stCwd">~</b></span>
  <span>exit <b id="stExit">-</b></span>
  <span>rtt <b id="stPing">-</b></span>
  <span>cron <b>daily 00:00 utc</b></span>
  <span id="stMsg">token → connect</span>
</div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.js"></script>
<script>
const $=id=>document.getElementById(id);
const term=new Terminal({cursorBlink:true,fontSize:14,scrollback:2000,theme:{background:'#000000',foreground:'#d7d7d7',cursor:'#4cc38a',selectionBackground:'#2a2a2a',black:'#000000',red:'#e06c75',green:'#4cc38a',yellow:'#e5c07b',blue:'#61afef',magenta:'#c678dd',cyan:'#56b6c2',white:'#d7d7d7',brightBlack:'#5c5c5c'}});
const fit=new FitAddon.FitAddon();
term.loadAddon(fit);term.open($('term'));fit.fit();
addEventListener('resize',()=>{try{fit.fit()}catch(_){}});
let connected=false,busy=false,cwd='/sec/root',hist=[],hi=-1,buf='',aborter=null;
const tokEl=$('token');
tokEl.value=localStorage.getItem('sf_token')||'';
const short=p=>p.replace(/^\/sec\/root/,'~');
const P=()=>'\r\n\x1b[1;32mroot@lsd\x1b[0m:\x1b[1;34m'+short(cwd)+'\x1b[0m# ';
const msg=t=>$('stMsg').textContent=t;
const nl=()=>{term.write(P());buf='';};
function setConn(on){connected=on;$('dot').classList.toggle('on',on);$('btnConn').textContent=on?'CUT':'CONNECT';tokEl.disabled=on;}
function toggleConn(){connected?cut():connect();}
function cut(){if(busy&&aborter)aborter.abort();setConn(false);msg('cut — tiap enter = 1 ssh, bukan sesi permanen');term.writeln('\r\n-- disconnected --');}
async function connect(){
  const t=tokEl.value.trim();
  if(!t){msg('isi controller token dulu');tokEl.focus();return;}
  localStorage.setItem('sf_token',t);
  setConn(true);msg('connecting…');
  const r=await api('uname -sr; uptime; df -h /sec | tail -1');
  if(r===null){setConn(false);return;}
  fit.fit();term.focus();nl();
}
async function api(cmd,timeout=55000){
  const t0=Date.now();aborter=new AbortController();
  try{
    const res=await fetch('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},signal:aborter.signal,body:JSON.stringify({token:tokEl.value.trim(),command:cmd})});
    $('stPing').textContent=((Date.now()-t0)/1000).toFixed(1)+'s';
    if(res.status===401){term.writeln('\r\ntoken salah');setConn(false);return null;}
    const j=await res.json();$('stExit').textContent=j.code;return j;
  }catch(e){if(e.name==='AbortError'){term.writeln('^C');return null;}term.writeln('\r\nnetwork error: '+e.message);return null;}
  finally{aborter=null;}
}
function show(j){
  if(!j)return;
  if(j.stdout)term.write('\r\n'+j.stdout.replace(/\n/g,'\r\n'));
  if(j.stderr)term.write('\r\n\x1b[31m'+j.stderr.replace(/\n/g,'\r\n')+'\x1b[0m');
  if(!j.ok)term.write('\r\n\x1b[31m[exit '+j.code+']\x1b[0m');
}
const withCwd=c=>'cd '+JSON.stringify(cwd)+' && '+c;
async function run(cmd){
  if(!connected){msg('connect dulu');return;}
  if(busy){msg('tunggu…');return;}
  term.write('\r\n\x1b[2m$ '+cmd+'\x1b[0m');busy=true;msg('running…');
  const j=await api(withCwd(cmd));busy=false;
  if(j&&connected)show(j);
  if(connected){nl();msg('ready');}
}
function snip(c){run(c);}
async function ping(){
  if(!connected){msg('connect dulu');return;}
  term.write('\r\n\x1b[2m$ keepalive\x1b[0m');
  try{const t0=Date.now();const res=await fetch('/api/keepalive');$('stPing').textContent=((Date.now()-t0)/1000).toFixed(1)+'s';term.write('\r\n'+(await res.text()).slice(0,300).replace(/\n/g,'\r\n'));}
  catch(e){term.write('\r\n\x1b[31m'+e.message+'\x1b[0m');}
  if(connected)nl();
}
const cur=()=>P().slice(2);
term.onData(async d=>{
  if(!connected)return;
  if(busy){if(d==='\x03'&&aborter)aborter.abort();return;}
  switch(d){
    case '\r':{
      term.write('\r\n');const cmd=buf;buf='';
      if(cmd.trim()){hist.push(cmd);hi=hist.length;}
      if(!cmd.trim()){nl();return;}
      const t=cmd.trim();
      if(t==='clear'){term.clear();nl();return;}
      if(t==='exit'){term.writeln('pakai tombol CUT — ini bukan sesi permanen.');nl();return;}
      busy=true;msg('running…');
      if(/^cd(\s|$)/.test(t)){
        const j=await api(withCwd(cmd)+' && pwd');busy=false;
        if(j&&j.ok){cwd=j.stdout.trim().split('\n').pop();$('stCwd').textContent=short(cwd);}
        if(connected){nl();msg('ready');}
        return;
      }
      const j=await api(withCwd(cmd));busy=false;
      if(j&&connected)show(j);
      if(connected){nl();msg('ready');}
      return;}
    case '\x7f':if(buf.length){buf=buf.slice(0,-1);term.write('\b \b');}return;
    case '\x03':term.write('^C');nl();return;
    case '\x0c':term.clear();nl();return;
    case '\x1b[A':
      if(hist.length){if(hi<=0)hi=0;else if(hi===-1)hi=hist.length-1;else hi--;buf=hist[hi];term.write('\r\x1b[K'+cur()+buf);}
      return;
    case '\x1b[B':
      if(hi>=0&&hi<hist.length-1){hi++;buf=hist[hi];term.write('\r\x1b[K'+cur()+buf);}
      else{hi=-1;buf='';term.write('\r\x1b[K'+cur());}
      return;
    default:if(d>=' '&&d<='~'||d>'\x7f'){buf+=d;term.write(d);}
  }
});
let simpleMode=false;
function toggleMode(){simpleMode=!simpleMode;$('term').style.display=simpleMode?'none':'block';$('simple').style.display=simpleMode?'flex':'none';$('btnMode').textContent=simpleMode?'TERM':'SIMPLE';if(!simpleMode){try{fit.fit()}catch(_){}term.focus();}}
async function sgo(){
  const el=$('sin'),out=$('sout'),cmd=el.value.trim();
  if(!cmd||!connected||busy){if(!connected)out.textContent+='\nconnect dulu';return;}
  el.value='';out.textContent+='\n$ '+cmd+'\n…';busy=true;
  const j=await api(withCwd(cmd));busy=false;
  if(j)out.textContent+=(j.stdout?j.stdout+'\n':'')+(j.stderr?'ERR '+j.stderr+'\n':'')+(j.ok?'':'[exit '+j.code+']\n');
  out.scrollTop=out.scrollHeight;
}
$('sin').addEventListener('keydown',e=>{if(e.key==='Enter')sgo();});
tokEl.addEventListener('keydown',e=>{if(e.key==='Enter')toggleConn();});
term.writeln('lsd.segfault.net — ketik perintah, enter untuk eksekusi.');
term.writeln('token tersimpan otomatis; connect otomatis saat dibuka ulang.');
nl();
if(tokEl.value.trim())connect();
</script>
</body>
</html>
