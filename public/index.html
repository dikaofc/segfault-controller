<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>segfault controller</title>
<style>
body{background:#0b0e14;color:#e6edf3;font-family:monospace;max-width:760px;margin:24px auto;padding:0 16px}
input,textarea{width:100%;background:#11161f;color:#e6edf3;border:1px solid #2a3342;border-radius:8px;padding:10px}
button{background:#1f6feb;border:0;color:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;margin:6px 6px 6px 0}
pre{background:#11161f;border:1px solid #2a3342;border-radius:8px;padding:12px;white-space:pre-wrap;min-height:120px}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<h3>segfault controller</h3>
<input id="token" type="password" placeholder="CONTROLLER_TOKEN">
<br><br>
<textarea id="cmd" rows="3">uptime; df -h /sec | tail -1; tmux ls 2>&1 | head -3; curl -s -m 3 -o /dev/null http://127.0.0.1:20128/v1/models && echo 9Router:HIDUP || echo 9Router:MATI; pgrep -f "hermes gateway" >/dev/null && echo gateway:HIDUP || echo gateway:MATI</textarea>
<br><br>
<div class="row">
<button onclick="go()">jalankan</button>
<button onclick="quick('/sec/root/segfault/up.sh')">pulihkan stack</button>
<button onclick="quick('tmux ls; echo ---; tail -20 /sec/root/.hermes/gateway-logs/up-trigger.log 2>/dev/null')">cek log</button>
<button onclick="ping()">tes keepalive</button>
</div>
<pre id="out">siap.</pre>
<script>
const out = document.getElementById('out');
async function go(){
  out.textContent = 'jalan...';
  const r = await fetch('/api/exec',{method:'POST',headers:{'Content-Type':'application/json'},
    body: JSON.stringify({token: document.getElementById('token').value, command: document.getElementById('cmd').value})});
  out.textContent = await r.text();
}
async function quick(c){ document.getElementById('cmd').value = c; go(); }
async function ping(){
  out.textContent = 'ping keepalive...';
  const r = await fetch('/api/keepalive');
  out.textContent = await r.text();
}
</script>
</body>
</html>
